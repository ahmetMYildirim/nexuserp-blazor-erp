name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Derle ve test et
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: .NET kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Bağımlılıkları geri yükle
        run: dotnet restore

      # TreatWarningsAsErrors açık — uyarı da build'i kırar
      - name: Derle
        run: dotnet build --no-restore --configuration Release

      # Testcontainers gerçek PostgreSQL başlatır; GitHub runner'ında Docker hazır gelir
      - name: Testler
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7

  docker:
    name: Docker imajı
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Buildx kurulumu
        uses: docker/setup-buildx-action@v3

      # Yalnızca imajın derlendiğini doğrular; kayıt defterine göndermez.
      - name: Web imajını derle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/NexusErp.Web/Dockerfile
          push: false
          tags: nexuserp-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
