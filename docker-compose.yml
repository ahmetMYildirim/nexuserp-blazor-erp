services:
  postgres:
    image: postgres:17-alpine
    container_name: nexuserp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexuserp
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_2026
      # Türkçe sıralama ve büyük/küçük harf dönüşümü.
      # ⚠️ --locale=tr_TR.UTF-8 TEK BAŞINA YETMEZ: alpine musl libc'de bu etiket kabul
      # edilir ama davranış C locale'dir (upper('istanbul') → 'ISTANBUL', 'İSTANBUL' değil).
      # ICU sağlayıcısı gerçek Türkçe kurallarını uygular; ILIKE ve ORDER BY doğru çalışır.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=tr-TR --locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5433:5432"        # 5433 → yerelde başka postgres varsa çakışmasın
    volumes:
      - nexuserp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexuserp"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexuserp-pgadmin
    restart: unless-stopped
    environment:
      # ⚠️ .local gibi "special-use" uzantılar pgAdmin tarafından geçersiz e-posta
      # sayılır ve container yeniden başlatma döngüsüne girer. Normal bir TLD kullan.
      PGADMIN_DEFAULT_EMAIL: admin@nexuserp.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Uygulamayı da container'da çalıştırmak için:
  #   docker compose --profile full up -d --build
  # Geliştirmede uygulamayı "dotnet run" ile çalıştırdığımız için varsayılan olarak kapalı.
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: src/NexusErp.Web/Dockerfile
    container_name: nexuserp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      # ⚠️ Host=postgres — container ağı içinden SERVİS ADIYLA erişilir,
      # localhost:5433 DEĞİL (o dışarıdan erişim portu).
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=nexuserp;Username=nexus;Password=nexus_dev_2026"
      Tenant__DefaultTenantId: "0195c8f0-0000-7000-8000-000000000001"
    ports:
      - "8080:8080"

  rabbitmq:
      image: rabbitmq:4-management-alpine
      container_name: nexuserp-mq
      restart: usnless-stopped
      environment:
        RABBITMQ_DEFAULT_USER: nexus
        RABBITMQ_DEFAULT_PASS: nexus_dev_2026
      ports:
        - "5672:5672"
        - "15672:15672"
      volumes:
        - nexuserp-mq-data:/var/lib/rabbitmq
      healthcheck:
        test: ["CMD-SHELL", "rabbitmqctl status"]
        interval: 15s
        timeout: 10s
        retries: 5

volumes:
  nexuserp-data:
